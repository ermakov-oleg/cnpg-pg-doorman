apiVersion: pg-doorman.cnpg.io/v1alpha1
kind: PgDoorman
metadata:
  name: my-cluster-doorman
spec:
  clusterRef:
    name: my-cluster
  pools:
    app:
      authQuery:
        user: doorman_auth
        # Without passwordSecretRef the plugin generates a basic-auth Secret
        # named "my-cluster-doorman-auth" with a random password. To bring
        # your own password, create the Secret (labeled
        # cnpg.io/cluster: my-cluster) and reference it here.
