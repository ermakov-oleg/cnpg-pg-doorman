apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: my-cluster
spec:
  instances: 3

  plugins:
    - name: pg-doorman.cnpg.io
      parameters:
        poolerPort: "6432"
        metricsPort: "9127"
        configName: "my-cluster-doorman"

  managed:
    roles:
      # CNPG keeps the doorman_auth password in sync with the Secret,
      # including rotation. The same Secret is referenced by
      # authQuery.passwordSecretRef in the PgDoorman resource.
      - name: doorman_auth
        login: true
        inherit: false
        passwordSecret:
          name: my-cluster-doorman-auth

  postgresql:
    pg_hba:
      # doorman_auth authenticates with its password; never use `trust` here:
      # any process in the pod could dump password hashes of all roles.
      - host all doorman_auth 127.0.0.1/32 scram-sha-256

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE ROLE doorman_auth WITH LOGIN NOINHERIT
        - |
          CREATE OR REPLACE FUNCTION public.doorman_auth_query(username TEXT)
          RETURNS TABLE (usename name, passwd text)
          SECURITY DEFINER
          SET search_path = pg_catalog
          LANGUAGE SQL
          AS $$ SELECT usename, passwd FROM pg_shadow WHERE usename = $1 $$
        - GRANT EXECUTE ON FUNCTION public.doorman_auth_query(TEXT) TO doorman_auth

  storage:
    size: 10Gi
