# Scrapes pg_doorman metrics from every PostgreSQL pod of the cluster.
# Requires the Prometheus Operator (PodMonitor CRD).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: my-cluster-doorman
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: my-cluster
  podMetricsEndpoints:
    - port: pgd-metrics
