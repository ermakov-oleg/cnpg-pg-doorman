apiVersion: v1
kind: ConfigMap
metadata:
  name: my-cluster-pg-doorman
data:
  pg_doorman.yaml: |
    general:
      host: "0.0.0.0"
      port: 6432
      connect_timeout: "3s"
      idle_timeout: "5m"
      server_lifetime: "5m"
      shutdown_timeout: "10s"
      max_connections: 8192
      worker_threads: 4
      admin_username: "admin"
      admin_password: "change-me"

    prometheus:
      enabled: true
      host: "0.0.0.0"
      port: 9127

    pools:
      app:
        server_host: "localhost"
        server_port: 5432
        pool_mode: "transaction"

        auth_query:
          query: "SELECT usename, passwd FROM pg_shadow WHERE usename = $1"
          user: "doorman_auth"
          password: ""
          database: "postgres"
          pool_size: 2
          default_pool_size: 40
          cache_ttl: "1h"
          cache_failure_ttl: "30s"
          min_interval: "1s"
