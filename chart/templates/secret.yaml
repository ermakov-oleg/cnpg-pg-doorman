# Equivalent of the kustomize secretGenerator: the plugin reads the wrapper
# sidecar image reference from this Secret via the SIDECAR_IMAGE env var.
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "cnpg-pg-doorman.labels" . | nindent 4 }}
  name: {{ include "cnpg-pg-doorman.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SIDECAR_IMAGE: {{ include "cnpg-pg-doorman.sidecarImage" . | quote }}
