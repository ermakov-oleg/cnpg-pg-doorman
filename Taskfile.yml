version: 3

vars:
  E2E_KUBERNETES_VERSION: v1.35.0
  KIND_CLUSTER_NAME: pg-doorman-e2e
  PLUGIN_IMAGE: pg-doorman-plugin:testing
  WRAPPER_IMAGE: pg-doorman-wrapper:testing
  CERT_MANAGER_VERSION: v1.17.2
  CNPG_VERSION: "1.28.0"

tasks:
  generate:
    desc: Generate deepcopy and CRD manifests
    cmds:
      - controller-gen object paths=./api/...
      - controller-gen crd paths=./api/... output:crd:dir=kubernetes/crd

  build:
    desc: Build all Go binaries
    cmds:
      - go build ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/... -v

  build-plugin-image:
    desc: Build plugin gRPC server Docker image
    cmds:
      - docker build -t {{.PLUGIN_IMAGE}} -f Dockerfile .

  build-wrapper-image:
    desc: Build wrapper sidecar Docker image
    cmds:
      - docker build -t {{.WRAPPER_IMAGE}} -f Dockerfile.wrapper .

  build-images:
    desc: Build all Docker images
    deps:
      - build-plugin-image
      - build-wrapper-image

  start-kind:
    desc: Create kind cluster for e2e tests
    run: once
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --image kindest/node:{{.E2E_KUBERNETES_VERSION}} --wait 5m
    status:
      - kind get clusters | grep -q {{.KIND_CLUSTER_NAME}}

  load-images:
    desc: Load Docker images into kind cluster
    deps:
      - build-images
      - start-kind
    cmds:
      - kind load docker-image {{.PLUGIN_IMAGE}} --name {{.KIND_CLUSTER_NAME}}
      - kind load docker-image {{.WRAPPER_IMAGE}} --name {{.KIND_CLUSTER_NAME}}

  install-cert-manager:
    desc: Install cert-manager into the cluster
    deps:
      - start-kind
    cmds:
      - kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{.CERT_MANAGER_VERSION}}/cert-manager.yaml
      - >
        kubectl wait --for=condition=Available deployment/cert-manager
        -n cert-manager --timeout=300s
      - >
        kubectl wait --for=condition=Available deployment/cert-manager-cainjector
        -n cert-manager --timeout=300s
      - >
        kubectl wait --for=condition=Available deployment/cert-manager-webhook
        -n cert-manager --timeout=300s
    status:
      - kubectl get deployment cert-manager -n cert-manager -o jsonpath='{.status.availableReplicas}' | grep -q '1'

  install-cnpg:
    desc: Install CloudNativePG operator
    deps:
      - start-kind
    cmds:
      - kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{.CNPG_VERSION}}/cnpg-{{.CNPG_VERSION}}.yaml
      - >
        kubectl wait --for=condition=Available deployment/cnpg-controller-manager
        -n cnpg-system --timeout=300s
    status:
      - kubectl get deployment cnpg-controller-manager -n cnpg-system -o jsonpath='{.status.availableReplicas}' | grep -q '1'

  deploy-plugin:
    desc: Deploy pg-doorman plugin to cluster
    deps:
      - load-images
      - install-cert-manager
      - install-cnpg
    cmds:
      - kubectl apply -k kubernetes/
      - kubectl rollout restart deployment/pg-doorman -n cnpg-system
      - >
        kubectl rollout status deployment/pg-doorman
        -n cnpg-system --timeout=120s

  e2e:
    desc: Run e2e tests (full cycle)
    deps:
      - deploy-plugin
    cmds:
      - >
        cd test/e2e && go test -v -timeout 30m
        -tags e2e
        -ginkgo.v
        ./...

  clean:
    desc: Clean up kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  publish:
    desc: Build and publish container images via Dagger
    requires:
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
        - REGISTRY_USER
        - REGISTRY_PASSWORD
    vars:
      PLUGIN_IMAGE_NAME: ghcr.io/{{.GITHUB_REPOSITORY}}{{if not (hasPrefix "refs/tags/v" .GITHUB_REF)}}-testing{{end}}
      WRAPPER_IMAGE_NAME: ghcr.io/{{.GITHUB_REPOSITORY}}-wrapper{{if not (hasPrefix "refs/tags/v" .GITHUB_REF)}}-testing{{end}}
      IMAGE_VERSION: '{{regexReplaceAll "(\\d+)/merge" .GITHUB_REF_NAME "pr-${1}"}}'
    env:
      # renovate: datasource=git-refs depName=docker lookupName=https://github.com/purpleclay/daggerverse currentValue=main
      DAGGER_DOCKER_SHA: ee12c1a4a2630e194ec20c5a9959183e3a78c192
    cmds:
      - >
        dagger call -m github.com/purpleclay/daggerverse/docker@${DAGGER_DOCKER_SHA}
        --registry ghcr.io --username $REGISTRY_USER --password env:REGISTRY_PASSWORD
        build --dir . --file Dockerfile --platform linux/amd64 --platform linux/arm64
        publish --ref {{.PLUGIN_IMAGE_NAME}} --tags {{.IMAGE_VERSION}}
      - >
        dagger call -m github.com/purpleclay/daggerverse/docker@${DAGGER_DOCKER_SHA}
        --registry ghcr.io --username $REGISTRY_USER --password env:REGISTRY_PASSWORD
        build --dir . --file Dockerfile.wrapper --platform linux/amd64 --platform linux/arm64
        publish --ref {{.WRAPPER_IMAGE_NAME}} --tags {{.IMAGE_VERSION}}

  manifest:
    desc: Generate install manifest for release
    requires:
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    cmds:
      - task: manifest-internal
        vars:
          GITHUB_REPOSITORY: '{{.GITHUB_REPOSITORY}}'
          GITHUB_REF: '{{.GITHUB_REF}}'
          GITHUB_REF_NAME: '{{.GITHUB_REF_NAME}}'

  manifest-internal:
    desc: Build kustomize manifest with correct image tags
    label: manifest-internal-{{.GITHUB_REF_NAME}}
    internal: true
    requires:
      vars:
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    vars:
      PLUGIN_IMAGE_NAME: ghcr.io/{{.GITHUB_REPOSITORY}}{{if not (hasPrefix "refs/tags/v" .GITHUB_REF)}}-testing{{end}}
      WRAPPER_IMAGE_NAME: ghcr.io/{{.GITHUB_REPOSITORY}}-wrapper{{if not (hasPrefix "refs/tags/v" .GITHUB_REF)}}-testing{{end}}
      IMAGE_VERSION: '{{regexReplaceAll "(\\d+)/merge" .GITHUB_REF_NAME "pr-${1}"}}'
    env:
      # renovate: datasource=git-refs depName=kustomize lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_KUSTOMIZE_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
    cmds:
      - >
        dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        edit --source . --dir kubernetes
        set image --image pg-doorman-plugin={{.PLUGIN_IMAGE_NAME}}:{{.IMAGE_VERSION}}
        set secret --secret pg-doorman --from-literal SIDECAR_IMAGE={{.WRAPPER_IMAGE_NAME}}:{{.IMAGE_VERSION}}
        directory directory --path kubernetes export --path manifest-build
      - >
        dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        build --source . --dir manifest-build export --path manifest.yaml

  upload-manifest-to-release:
    desc: Upload manifest.yaml to GitHub Release
    requires:
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
        - GITHUB_TOKEN
    env:
      # renovate: datasource=git-refs depName=gh lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_GH_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, skipping manifest upload
    cmds:
      - >
        dagger -s call -m github.com/sagikazarmark/daggerverse/gh@${DAGGER_GH_SHA}
        with-source --source .
        run --repo {{.GITHUB_REPOSITORY}} --token env:GITHUB_TOKEN
        --cmd "release upload {{.GITHUB_REF_NAME}} manifest.yaml"
