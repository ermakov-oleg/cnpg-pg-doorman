version: 3

vars:
  E2E_KUBERNETES_VERSION: v1.35.0
  KIND_CLUSTER_NAME: pg-doorman-e2e
  PLUGIN_IMAGE: pg-doorman-plugin:testing
  WRAPPER_IMAGE: pg-doorman-wrapper:testing

tasks:
  build:
    desc: Build all Go binaries
    cmds:
      - go build ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/... -v

  build-plugin-image:
    desc: Build plugin gRPC server Docker image
    cmds:
      - docker build -t {{.PLUGIN_IMAGE}} -f Dockerfile .

  build-wrapper-image:
    desc: Build wrapper sidecar Docker image
    cmds:
      - docker build -t {{.WRAPPER_IMAGE}} -f Dockerfile.wrapper .

  build-images:
    desc: Build all Docker images
    deps:
      - build-plugin-image
      - build-wrapper-image

  start-kind:
    desc: Create kind cluster for e2e tests
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --image kindest/node:{{.E2E_KUBERNETES_VERSION}} --wait 5m
    status:
      - kind get clusters | grep -q {{.KIND_CLUSTER_NAME}}

  load-images:
    desc: Load Docker images into kind cluster
    deps:
      - build-images
      - start-kind
    cmds:
      - kind load docker-image {{.PLUGIN_IMAGE}} --name {{.KIND_CLUSTER_NAME}}
      - kind load docker-image {{.WRAPPER_IMAGE}} --name {{.KIND_CLUSTER_NAME}}

  e2e:
    desc: Run e2e tests (full cycle)
    deps:
      - load-images
    cmds:
      - >
        cd test/e2e && go test -v -timeout 30m
        -ginkgo.v
        ./...

  clean:
    desc: Clean up kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}
