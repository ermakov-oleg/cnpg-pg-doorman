apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-doorman-server
spec:
  secretName: pg-doorman-server-tls
  commonName: pg-doorman
  # The service FQDNs are required by the binary delivery endpoint: wrappers
  # live in the cluster namespaces and reach it as --binary-base-url, so the
  # short in-namespace name CNPG uses for gRPC is not enough.
  dnsNames:
    - pg-doorman
    - pg-doorman.cnpg-system.svc
    - pg-doorman.cnpg-system.svc.cluster.local
  duration: 8760h # 1y: rare rotations shrink the CNPG-side leaf-pinning window
  renewBefore: 360h
  isCA: false
  usages:
    - server auth
  issuerRef:
    name: pg-doorman-ca-issuer
    kind: Issuer
    group: cert-manager.io
