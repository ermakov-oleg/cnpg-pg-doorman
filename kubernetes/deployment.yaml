apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pg-doorman
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pg-doorman
    spec:
      serviceAccountName: pg-doorman
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pg-doorman
                topologyKey: kubernetes.io/hostname
      containers:
        - image: pg-doorman-plugin:latest
          name: pg-doorman
          args:
            - serve
            - --server-cert=/server/tls.crt
            - --server-key=/server/tls.key
            - --client-cert=/client/tls.crt
            - --server-address=:9090
            - --leader-elect
          ports:
            - containerPort: 9090
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
          env:
            - name: SIDECAR_IMAGE
              valueFrom:
                secretKeyRef:
                  name: pg-doorman
                  key: SIDECAR_IMAGE
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - mountPath: /server
              name: server
            - mountPath: /client
              name: client
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: server
          secret:
            secretName: pg-doorman-server-tls
        - name: client
          secret:
            secretName: pg-doorman-client-tls
