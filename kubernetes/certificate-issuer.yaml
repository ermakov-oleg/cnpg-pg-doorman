# Bootstrap chain: a self-signed CA and an Issuer backed by it. Both leaf
# certificates are issued from the CA so peers can verify by CA instead of
# pinning exact leafs, which breaks on rotation.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-doorman-ca
spec:
  secretName: pg-doorman-ca
  commonName: pg-doorman-ca
  isCA: true
  duration: 87600h # 10y
  renewBefore: 8760h # 1y
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pg-doorman-ca-issuer
spec:
  ca:
    secretName: pg-doorman-ca
