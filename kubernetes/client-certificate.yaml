apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-doorman-client
spec:
  secretName: pg-doorman-client-tls
  commonName: pg-doorman-client
  duration: 8760h # 1y: rare rotations shrink the CNPG-side leaf-pinning window
  renewBefore: 360h
  isCA: false
  usages:
    - client auth
  issuerRef:
    name: pg-doorman-ca-issuer
    kind: Issuer
    group: cert-manager.io
