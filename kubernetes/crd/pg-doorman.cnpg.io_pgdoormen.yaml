---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: pgdoormen.pg-doorman.cnpg.io
spec:
  group: pg-doorman.cnpg.io
  names:
    kind: PgDoorman
    listKind: PgDoormanList
    plural: pgdoormen
    shortNames:
    - pgd
    singular: pgdoorman
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pools
      name: Pools
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PgDoorman is the Schema for the pgdoormans API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PgDoormanSpec defines the desired state of PgDoorman.
            properties:
              clusterRef:
                description: |-
                  ClusterRef names the CNPG Cluster this configuration belongs to. It is
                  the source of truth for the Cluster<->PgDoorman relation (the
                  configName plugin parameter is only discovery), enabling ownership,
                  status aggregation and admission validation. Immutable.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: clusterRef is immutable
                  rule: self.name == oldSelf.name
              general:
                description: General settings for pg_doorman.
                properties:
                  adminPasswordSecretRef:
                    description: |-
                      AdminPasswordSecretRef references a Secret containing the admin password.
                      There is deliberately no plaintext alternative: a password in the CR
                      would land in etcd, GitOps repos and manifest backups. When unset, the
                      wrapper generates a random per-pod password.
                    properties:
                      key:
                        description: The key to select
                        type: string
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  adminUsername:
                    default: admin
                    description: 'AdminUsername is the admin user (default: "admin").'
                    type: string
                  connectTimeout:
                    default: 3s
                    description: |-
                      ConnectTimeout is the connection timeout (default: "3s").
                      A plain number is milliseconds; suffixes ms/s/m/h/d are supported.
                    pattern: ^[0-9]+(ms|s|m|h|d)?$
                    type: string
                  idleTimeout:
                    default: 5m
                    description: |-
                      IdleTimeout is the idle connection timeout (default: "5m").
                      A plain number is milliseconds; suffixes ms/s/m/h/d are supported.
                    pattern: ^[0-9]+(ms|s|m|h|d)?$
                    type: string
                  maxConnections:
                    default: 8192
                    description: 'MaxConnections is the maximum number of connections
                      (default: 8192).'
                    minimum: 1
                    type: integer
                  serverLifetime:
                    default: 5m
                    description: |-
                      ServerLifetime is the server connection lifetime (default: "5m").
                      A plain number is milliseconds; suffixes ms/s/m/h/d are supported.
                    pattern: ^[0-9]+(ms|s|m|h|d)?$
                    type: string
                  shutdownTimeout:
                    default: 10s
                    description: |-
                      ShutdownTimeout is the graceful shutdown timeout (default: "10s").
                      A plain number is milliseconds; suffixes ms/s/m/h/d are supported.
                    pattern: ^[0-9]+(ms|s|m|h|d)?$
                    type: string
                  workerThreads:
                    default: 4
                    description: 'WorkerThreads is the number of worker threads (default:
                      4).'
                    minimum: 1
                    type: integer
                type: object
              pools:
                additionalProperties:
                  description: PoolSpec defines configuration for a single connection
                    pool.
                  properties:
                    authQuery:
                      description: AuthQuery defines auth_query-based authentication.
                      properties:
                        database:
                          default: postgres
                          description: 'Database is the database for auth queries
                            (default: "postgres").'
                          type: string
                        passwordSecretRef:
                          description: |-
                            PasswordSecretRef references a Secret containing the auth user password.
                            If not set, empty password is used.
                          properties:
                            key:
                              description: The key to select
                              type: string
                            name:
                              description: Name of the referent.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        poolSize:
                          default: 2
                          description: |-
                            PoolSize is the number of executor connections running auth queries (default: 2).
                            Maps to auth_query.workers.
                          minimum: 1
                          type: integer
                        query:
                          default: SELECT * FROM public.doorman_auth_query($1)
                          description: 'Query is the SQL query (default: "SELECT *
                            FROM public.doorman_auth_query($1)").'
                          type: string
                        user:
                          description: User is the PostgreSQL user for auth queries.
                          minLength: 1
                          type: string
                      required:
                      - user
                      type: object
                    defaultPoolSize:
                      default: 40
                      description: |-
                        DefaultPoolSize is the data pool size per auth_query user (default: 40).
                        Maps to auth_query.pool_size.
                      minimum: 1
                      type: integer
                    poolMode:
                      default: transaction
                      description: 'PoolMode is the pooling mode (default: "transaction").'
                      enum:
                      - session
                      - transaction
                      type: string
                    users:
                      description: Users defines static user credentials.
                      items:
                        description: UserSpec defines a static user.
                        properties:
                          passwordSecretRef:
                            description: PasswordSecretRef references a Secret containing
                              the user password.
                            properties:
                              key:
                                description: The key to select
                                type: string
                              name:
                                description: Name of the referent.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          poolSize:
                            default: 20
                            description: 'PoolSize is the pool size for this user
                              (default: 20).'
                            minimum: 1
                            type: integer
                          username:
                            description: Username is the PostgreSQL username.
                            minLength: 1
                            type: string
                        required:
                        - passwordSecretRef
                        - username
                        type: object
                      type: array
                  type: object
                  x-kubernetes-validations:
                  - message: pool must define users or authQuery
                    rule: (has(self.users) && self.users.size() > 0) || has(self.authQuery)
                description: Pools defines the connection pools.
                minProperties: 1
                type: object
              prometheus:
                description: Prometheus metrics configuration.
                properties:
                  enabled:
                    default: true
                    description: 'Enabled controls whether Prometheus metrics are
                      enabled (default: true).'
                    type: boolean
                type: object
            required:
            - clusterRef
            - pools
            type: object
          status:
            description: PgDoormanStatus defines the observed state of PgDoorman.
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
