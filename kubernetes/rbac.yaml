apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman
rules:
  # Watch PgDoorman CRDs (rendering controller); update manages the in-use finalizer
  - apiGroups: ["pg-doorman.cnpg.io"]
    resources: ["pgdoormen"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["pg-doorman.cnpg.io"]
    resources: ["pgdoormen/status"]
    verbs: ["update", "patch"]
  # Watch Clusters: plugin parameters carry ports and the configName
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Render per-cluster config Secrets; the informer is label-scoped to
  # cnpg.io/cluster, so unlabeled secrets are never cached or readable.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Events on PgDoorman for render failures
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Cleanup of legacy per-cluster Roles/RoleBindings (pre-rendered-config)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "delete"]
  # Manage the pooler read-write Service per cluster
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pg-doorman
subjects:
  - kind: ServiceAccount
    name: pg-doorman
    namespace: cnpg-system
---
# Leader election (controller runnables run on one replica only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-doorman-leader-election
subjects:
  - kind: ServiceAccount
    name: pg-doorman
    namespace: cnpg-system
