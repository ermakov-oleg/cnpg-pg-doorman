apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman
rules:
  # Read PgDoorman CRDs (cached by controller-runtime)
  - apiGroups: ["pg-doorman.cnpg.io"]
    resources: ["pgdoormen"]
    verbs: ["get", "list", "watch"]
  # Manage Roles in cluster namespaces (direct, no cache)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Manage RoleBindings in cluster namespaces (direct, no cache)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch", "delete"]
  # Manage the pooler read-write Service per cluster
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  # Allow delegating Secret reads to per-cluster Roles without RBAC escalation failure
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pg-doorman
subjects:
  - kind: ServiceAccount
    name: pg-doorman
    namespace: cnpg-system
---
# Leader election (controller runnables run on one replica only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: pg-doorman
  name: pg-doorman-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-doorman-leader-election
subjects:
  - kind: ServiceAccount
    name: pg-doorman
    namespace: cnpg-system
