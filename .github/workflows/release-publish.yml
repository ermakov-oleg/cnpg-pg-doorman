name: Release Publish Artifacts

on:
  release:
    types: [published]

permissions: read-all

jobs:
  gate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: Run unit tests
        run: go test ./internal/... -race

  release-publish-artifacts:
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install QEMU static binaries
        uses: docker/setup-qemu-action@v4
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.9
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Create image and manifest
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task publish
          task manifest
      - name: Attach manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task upload-manifest-to-release

  publish-chart:
    runs-on: ubuntu-latest
    needs: [release-publish-artifacts]
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
      - name: Package and push chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          helm package chart/ --version "${VERSION#v}" --app-version "${VERSION}"
          helm push "cnpg-pg-doorman-${VERSION#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
