name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./internal/... -v -race

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Docker images
        run: |
          docker build -t pg-doorman-plugin:testing -f Dockerfile .
          docker build -t pg-doorman-wrapper:testing -f Dockerfile.wrapper .

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pg-doorman-e2e
          node_image: kindest/node:v1.35.0

      - name: Load images into KinD
        run: |
          kind load docker-image pg-doorman-plugin:testing --name pg-doorman-e2e
          kind load docker-image pg-doorman-wrapper:testing --name pg-doorman-e2e

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
          kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=120s

      - name: Install CNPG operator
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.28.0/cnpg-1.28.0.yaml
          kubectl wait --for=condition=Available deployment --all -n cnpg-system --timeout=120s

      - name: Deploy pg-doorman plugin
        run: |
          kubectl apply -k kubernetes/

      - name: Wait for plugin to be ready
        run: |
          kubectl wait --for=condition=Available deployment/pg-doorman -n cnpg-system --timeout=120s

      - name: Run E2E tests
        run: |
          cd test/e2e && go test -v -timeout 30m -tags e2e -ginkgo.v ./...

  publish:
    name: Publish Testing Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install QEMU static binaries
        uses: docker/setup-qemu-action@v4
      - name: Install Task
        uses: arduino/setup-task@v2
      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.8
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Publish images
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task publish
