name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: "kindest/node version for the bounds e2e run (e.g. v1.29.14)"
        required: false
        default: ""
      cnpg_version:
        description: "CNPG version for the bounds e2e run (e.g. 1.24.2)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./internal/... -v -race

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v3.0.0

      # The action's default kind binary can be too old for the kindest/node
      # image from the Taskfile (containerd config version mismatch), so the
      # version comes from the same Taskfile vars.
      - name: Install KinD
        run: |
          KIND_VERSION=$(awk '/^  KIND_VERSION:/ {print $2}' Taskfile.yml)
          curl -sSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version

      # Single source of tool versions: Taskfile.yml vars (tracked by renovate).
      - name: Run E2E tests
        run: task e2e

      - name: Dump cluster state
        if: failure()
        run: |
          mkdir -p e2e-diagnostics
          kubectl get pods -A -o wide > e2e-diagnostics/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > e2e-diagnostics/events.txt 2>&1 || true
          kubectl get clusters.postgresql.cnpg.io -A -o yaml > e2e-diagnostics/clusters.yaml 2>&1 || true
          kubectl get pgdoormen -A -o yaml > e2e-diagnostics/pgdoormen.yaml 2>&1 || true
          kubectl describe pods -A > e2e-diagnostics/describe-pods.txt 2>&1 || true
          kubectl logs -n cnpg-system deployment/pg-doorman --all-containers --tail=-1 > e2e-diagnostics/plugin.log 2>&1 || true
          kubectl logs -n cnpg-system deployment/cnpg-controller-manager --tail=5000 > e2e-diagnostics/cnpg-operator.log 2>&1 || true
          for pod in $(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' | grep -v -E '^(kube-system|local-path-storage|cert-manager)/'); do
            ns=${pod%%/*}; name=${pod##*/}
            kubectl logs -n "$ns" "$name" -c pg-doorman --tail=-1 > "e2e-diagnostics/sidecar-$ns-$name.log" 2>/dev/null || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/

  # Manual bounds check: verifies the suite against the minimum supported
  # K8s/CNPG versions from the README (or any other combination).
  e2e-bounds:
    name: E2E Bounds Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' && (inputs.kubernetes_version != '' || inputs.cnpg_version != '')
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
      - name: Install KinD
        run: |
          KIND_VERSION=$(awk '/^  KIND_VERSION:/ {print $2}' Taskfile.yml)
          curl -sSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Run E2E tests at requested versions
        run: |
          ARGS=""
          [ -n "${{ inputs.kubernetes_version }}" ] && ARGS="$ARGS E2E_KUBERNETES_VERSION=${{ inputs.kubernetes_version }}"
          [ -n "${{ inputs.cnpg_version }}" ] && ARGS="$ARGS CNPG_VERSION=${{ inputs.cnpg_version }}"
          task e2e $ARGS

  publish:
    name: Publish Testing Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install QEMU static binaries
        uses: docker/setup-qemu-action@v4
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.8
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Publish images
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task publish
